<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>RipForge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="message"></div>
    
    <button id="startBtn"> START BATTLE </button>
    
    <div id="crosshair"></div>
    
    <!-- NEW: Finisher button -->
    <div id="finisherContainer" style="display:none;">
      <div id="finisherCharge"></div>
      <button id="finisherBtn">★</button>
    </div>
    
    <!-- NEW: Move indicators -->
    <div id="moveIndicators" style="display:none;">
      <div id="move1Icon"></div>
      <div id="move2Icon"></div>
    </div>
    
    <script type="module" src="main.js"></script>
</body>
</html>
